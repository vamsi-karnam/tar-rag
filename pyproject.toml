[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tar-rag"
version = "0.3.0"
description = "Topology-Aware Retrieval for RAG — structure from folders down to sections inside files, with no LLM in the routing"
readme = "pypi/README_PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
authors = [
    { name = "Vamsi Karnam" }
]
keywords = [
    "rag",
    "retrieval",
    "vector-search",
    "llm",
    "topology",
    "knowledge-base",
    "structured-retrieval",
    "semantic-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

# The core install holds what ingest and routing need, and no vector store or
# LLM client. tar-rag's adapters take a client you create, so install only the
# one you use, or `tar-rag[all]`.
dependencies = [
    "pypdf>=6.21.4",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.9.0",
    "pillow>=13.0.0",
    "tesserocr>=2.12.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
openai   = ["openai>=1.66.0"]
pinecone = ["pinecone>=5.0.0"]
qdrant   = ["qdrant-client>=1.10.0"]
chroma   = ["chromadb>=0.4.0"]
all      = ["tar-rag[openai,pinecone,qdrant,chroma]"]
# Kept as no-op aliases so older install commands still resolve.
pdf      = []
docx     = []

# Development / test environment
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "reportlab>=4.0.0",
]

[project.urls]
Homepage   = "https://github.com/vamsi-karnam/tar-rag"
Repository = "https://github.com/vamsi-karnam/tar-rag"
Issues     = "https://github.com/vamsi-karnam/tar-rag/issues"

[project.scripts]
tar-rag = "tar_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tar_rag"]

[tool.hatch.build.targets.sdist]
include = [
    "tar_rag",
    "tests",
    "examples",
    "pypi/README_PYPI.md",
    "README.md",
    "assets/system-flow.svg",
    "LICENSE",
    "THIRD_PARTY_NOTICES",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "IMPLEMENTATION_PLAN.md",
    # benchmarks/ contains live benchmark docs and gitignored local
    # corpora (CPython reduction, code-corpora-master). The corpora
    # are derivative of upstream sources and are not redistributable;
    # benchmark.md itself is accessible via the GitHub repo.
    "benchmarks/**",
    # Legacy path from before v0.2.0 — kept here as a safety net in
    # case any branch still has files under docs/.
    "docs/**",
    # Local study material, never published.
    "experiment/**",
    "paper/**",
    "MEMORY.md",
    # Local outputs from running tar-rag during development.
    "tar_rag_output/**",
    "tar_rag_output_corpora/**",
    # Local builds.
    "dist/**",
    ".pytest_cache/**",
    "**/.pytest_cache/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "RUF022", # `__all__` is intentionally grouped by semantic category, not alphabetised
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests requiring live API credentials (deselect with -m 'not live')",
    "benchmark: marks benchmark comparison tests",
]
